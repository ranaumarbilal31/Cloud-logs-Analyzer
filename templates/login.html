<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login · CloudLog Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0c10; --surface: #111318; --surface2: #1a1d24;
      --border: #252830; --accent: #00e5ff; --accent2: #ff4d6d;
      --accent3: #a8ff78; --text: #e2e8f0; --muted: #6b7280;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
      position: relative; z-index: 1;
      animation: slideUp 0.4s ease both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
    }
    .login-logo h1 span { color: var(--accent2); }
    .login-logo p { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    .btn-login {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .btn-login:hover { background: #33eaff; transform: translateY(-1px); }
    .default-creds {
      margin-top: 1rem;
      padding: 0.75rem;
      background: rgba(168,255,120,0.06);
      border: 1px solid rgba(168,255,120,0.15);
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--accent3);
      text-align: center;
    }
    .alert {
      padding: 0.65rem 0.9rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.78rem;
      border-left: 3px solid var(--accent2);
      background: rgba(255,77,109,0.1);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <h1>Cloud<span>Log</span> ▸</h1>
      <p>Secure Cloud Log Analyzer · CS-508</p>
    </div>
    <div class="login-card">
      {% with messages = get_flashed_messages(with_categories=True) %}
        {% for category, message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="admin" autocomplete="username" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-login">→ Sign In</button>
      </form>
      <div class="default-creds">Default: admin / admin123</div>
    </div>
  </div>
</body>
</html>
